apiVersion: lakeflow.io/v1alpha1
kind: LakeFlow
metadata:
  name: golden-spark-features
  namespace: lakeflow-golden
spec:
  trigger: {}
  tasks:
    - name: feature-job
      executor: spark
      sparkExecutor:
        image: docker-registry.lakeflow.io/data-prod/spark:3.5.3-scala2.12-java17-python3-r-ubuntu
        sparkVersion: "3.5.3"
        mainClass: com.example.FeatureJob
        mainApplicationFile: local:///mnt/spark/feature-job.jar
        queueName: golden-queue
        executorOffHeapMemory: "1g"
        executorMemoryOverhead: "1g"
        driverResource:
          resources:
            requests:
              cpu: "1"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "1Gi"
        executorResource:
          replicas: 3
          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
        hiveMetastoreSpec:
          hiveHmsUri: thrift://hive-metastore.golden.local:9083
          libPath: /opt/hive/lib/*
        icebergWarehouse: oss://golden-bucket/warehouse
