apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Reference the base configuration
resources:
- ../../default

# Override the image for development with k3d registry
images:
- name: controller
  newName: dev-registry.localhost:5001/lakeflow-controller
  newTag: latest

# Dev-specific namespace (optional)
namespace: lakeflow-controller-dev

# Dev-specific name prefix
namePrefix: dev-

# Labels for dev environment
labels:
- includeSelectors: true
  pairs:
    environment: dev
    managed-by: kustomize-dev