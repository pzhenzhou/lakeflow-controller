# Adds namespace to all resources.
namespace: lakeflow-controller-system

# Value of this field is prepended to the
# names of all resources, e.g. a deployment named
# "wordpress" becomes "alices-wordpress".
# Note that it should also match with the prefix (text before '-') of the namespace
# field above.
namePrefix: lakeflow-controller-

# Labels to add to all resources (metadata only, not selectors).
# Note: app.kubernetes.io/name is set individually per resource to allow ServiceMonitor
# to use a different value required by Prometheus selector
#labels:
#- includeSelectors: false
#  pairs:
#    app.kubernetes.io/name: lakeflow-controller

resources:
- ../crd
- ../rbac
- ../manager
# [WEBHOOK] LakeFlow validating admission webhook (Service + ValidatingWebhookConfiguration).
- ../webhook
# [CERTMANAGER] cert-manager self-signed issuer + serving cert for the webhook. Requires cert-manager in the cluster.
- ../certmanager
# [PROMETHEUS] To enable prometheus monitor, uncomment all sections with 'PROMETHEUS'.
- ../prometheus
# [METRICS] Expose the controller manager metrics service.
- metrics_service.yaml
# [NETWORK POLICY] Protect the /metrics endpoint and Webhook Server with NetworkPolicy.
# Only Pod(s) running a namespace labeled with 'metrics: enabled' will be able to gather the metrics.
# Only CR(s) which requires webhooks and are applied on namespaces labeled with 'webhooks: enabled' will
# be able to communicate with the Webhook Server.
#- ../network-policy

# Uncomment the patches line if you enable Metrics
patches:
# [METRICS] The following patch will enable the metrics endpoint using HTTPS and the port :8443.
# More info: https://book.kubebuilder.io/reference/metrics
- path: manager_metrics_patch.yaml
  target:
    kind: Deployment

# Uncomment the patches line if you enable Metrics and CertManager
# [METRICS-WITH-CERTS] To enable metrics protected with certManager, uncomment the following line.
# This patch will protect the metrics with certManager self-signed certs.
#- path: cert_metrics_manager_patch.yaml
#  target:
#    kind: Deployment

# [WEBHOOK] Mount the webhook serving cert + expose the webhook port on every manager Deployment.
- path: manager_webhook_patch.yaml
  target:
    kind: Deployment

# [CERTMANAGER] CA injection for the validating webhook.
# These replacements (1) fill the serving Certificate dnsNames from the webhook
# Service name/namespace, and (2) inject the cert-manager CA into the
# ValidatingWebhookConfiguration via the cert-manager.io/inject-ca-from annotation.
# Only the webhook/validating blocks are enabled here; the metrics, mutating, and
# conversion blocks from the kubebuilder scaffold are intentionally omitted because
# this project has no metrics cert, mutating webhook, or conversion webhook.
replacements:
- source:
    kind: Service
    version: v1
    name: webhook-service
    fieldPath: .metadata.name # Name of the service
  targets:
    - select:
        kind: Certificate
        group: cert-manager.io
        version: v1
        name: serving-cert
      fieldPaths:
        - .spec.dnsNames.0
        - .spec.dnsNames.1
      options:
        delimiter: '.'
        index: 0
        create: true
- source:
    kind: Service
    version: v1
    name: webhook-service
    fieldPath: .metadata.namespace # Namespace of the service
  targets:
    - select:
        kind: Certificate
        group: cert-manager.io
        version: v1
        name: serving-cert
      fieldPaths:
        - .spec.dnsNames.0
        - .spec.dnsNames.1
      options:
        delimiter: '.'
        index: 1
        create: true
- source:
    kind: Certificate
    group: cert-manager.io
    version: v1
    name: serving-cert # This name should match the one in certificate.yaml
    fieldPath: .metadata.namespace # Namespace of the certificate CR
  targets:
    - select:
        kind: ValidatingWebhookConfiguration
      fieldPaths:
        - .metadata.annotations.[cert-manager.io/inject-ca-from]
      options:
        delimiter: '/'
        index: 0
        create: true
- source:
    kind: Certificate
    group: cert-manager.io
    version: v1
    name: serving-cert
    fieldPath: .metadata.name
  targets:
    - select:
        kind: ValidatingWebhookConfiguration
      fieldPaths:
        - .metadata.annotations.[cert-manager.io/inject-ca-from]
      options:
        delimiter: '/'
        index: 1
        create: true
# Do not remove the following scaffold markers; required for kubebuilder codegen.
# +kubebuilder:scaffold:crdkustomizecainjectionns
# +kubebuilder:scaffold:crdkustomizecainjectionname
